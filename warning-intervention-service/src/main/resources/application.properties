spring.application.name=warning-intervention-service
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
spring.datasource.url=${database_url}
spring.datasource.username=${database_user3}
spring.datasource.password=${database_password3}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
app.jwt.issuer=${JWT_ISSUER}
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
server.error.include-stacktrace=never
