# ============================================================
# API GATEWAY - MSME EARLY WARNING SYSTEM
# ============================================================

# 1. APPLICATION CONFIGURATION
spring.application.name=api-gateway
server.port=8081

# 2. EUREKA SERVICE DISCOVERY
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 3. MSME SERVICE ROUTING
# Handles Auth, Users, MSMEs, Financial Snapshots
spring.cloud.gateway.server.webflux.routes[0].id=msme-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MSME-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/msmes/**,/api/snapshots/**,/api/assessment-data/**,/api/users,/api/msmes,/api/snapshots

# 4. ASSESSMENT SERVICE ROUTING
# Handles Assessments and Thresholds
spring.cloud.gateway.server.webflux.routes[1].id=assessment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ASSESSMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/assessment/**

# 5. WARNING & INTERVENTION SERVICE ROUTING
# Handles Warnings, Decisions, Interventions, Follow-ups
spring.cloud.gateway.server.webflux.routes[2].id=warning-intervention-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://WARNING-INTERVENTION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/warnings/**,/api/interventions/**,/api/warnings


# 6. ACTUATOR
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

# 7. LOGGING
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG