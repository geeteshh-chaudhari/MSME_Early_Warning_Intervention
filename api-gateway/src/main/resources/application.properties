# ============================================================
# API GATEWAY - MSME EARLY WARNING SYSTEM
# ============================================================

# 1. APPLICATION CONFIGURATION
spring.application.name=api-gateway
server.port=8081

# 2. EUREKA SERVICE DISCOVERY
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 3. MSME SERVICE ROUTING
# Handles Auth, Users, MSMEs, Financial Snapshots
spring.cloud.gateway.server.webflux.routes[0].id=msme-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MSME-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/msmes/**,/api/snapshots/**,/api/assessment-data/**,/api/users,/api/msmes,/api/snapshots

# 4. ASSESSMENT SERVICE ROUTING
# Handles Assessments and Thresholds
spring.cloud.gateway.server.webflux.routes[1].id=assessment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ASSESSMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/assessment/**

# 5. WARNING & INTERVENTION SERVICE ROUTING
# Handles Warnings, Decisions, Interventions, Follow-ups
spring.cloud.gateway.server.webflux.routes[2].id=warning-intervention-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://WARNING-INTERVENTION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/warnings/**,/api/interventions/**,/api/warnings,/api/notifications

# Recommendation API
spring.cloud.gateway.server.webflux.routes[3].id=recommendation-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/recommendations

# Dashboard APIs
spring.cloud.gateway.server.webflux.routes[4].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://DASHBOARD-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/dashboard/**

# 6. ACTUATOR
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

# 7. LOGGING
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
# Central Swagger UI and service OpenAPI specifications
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urlsPrimaryName=MSME
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.filter=true

springdoc.swagger-ui.urls[0].name=MSME
springdoc.swagger-ui.urls[0].url=/openapi/msme
spring.cloud.gateway.server.webflux.routes[5].id=msme-openapi
spring.cloud.gateway.server.webflux.routes[5].uri=lb://MSME-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/openapi/msme
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

springdoc.swagger-ui.urls[1].name=Assessment
springdoc.swagger-ui.urls[1].url=/openapi/assessment
spring.cloud.gateway.server.webflux.routes[6].id=assessment-openapi
spring.cloud.gateway.server.webflux.routes[6].uri=lb://ASSESSMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/openapi/assessment
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/v3/api-docs

springdoc.swagger-ui.urls[2].name=Warning and Intervention
springdoc.swagger-ui.urls[2].url=/openapi/warning
spring.cloud.gateway.server.webflux.routes[7].id=warning-openapi
spring.cloud.gateway.server.webflux.routes[7].uri=lb://WARNING-INTERVENTION-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/openapi/warning
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs

springdoc.swagger-ui.urls[3].name=Recommendation
springdoc.swagger-ui.urls[3].url=/openapi/recommendation
spring.cloud.gateway.server.webflux.routes[8].id=recommendation-openapi
spring.cloud.gateway.server.webflux.routes[8].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/openapi/recommendation
spring.cloud.gateway.server.webflux.routes[8].filters[0]=SetPath=/openapi.json

springdoc.swagger-ui.urls[4].name=Dashboard
springdoc.swagger-ui.urls[4].url=/openapi/dashboard
spring.cloud.gateway.server.webflux.routes[9].id=dashboard-openapi
spring.cloud.gateway.server.webflux.routes[9].uri=lb://DASHBOARD-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/openapi/dashboard
spring.cloud.gateway.server.webflux.routes[9].filters[0]=SetPath=/openapi.json
