# ============================================================
# MS2 - ASSESSMENT MICROSERVICE
# MSME EARLY WARNING AND INTERVENTION SYSTEM
# ============================================================


# ============================================================
# 1. APPLICATION CONFIGURATION
# ============================================================

spring.application.name=assessment-service
server.port=8083


# ============================================================
# 2. ORACLE DATABASE CONFIGURATION (USER2)
# ============================================================

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=USER4
spring.datasource.password=User123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# ============================================================
# 3. DATABASE INITIALIZATION
# ============================================================

# Oracle tables already exist
spring.sql.init.mode=never

# Do not automatically create or modify tables
# MS2 uses Spring JDBC, not Hibernate/JPA


# ============================================================
# 4. EUREKA SERVICE DISCOVERY
# ============================================================

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=${EUREKA_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_ENABLED:true}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8080/eureka/}


# ============================================================
# 5. MS1 - FINANCIAL DATA SERVICE INTEGRATION
# ============================================================

# Update the URL according to the actual MS1 port
msme.finance.base-url=${FINANCE_SERVICE_URL:http://localhost:8082}

# HTTP client timeouts in milliseconds
msme.finance.connect-timeout-ms=3000
msme.finance.read-timeout-ms=5000


# ============================================================
# 6. SECURITY - MS1 JWT AUTHENTICATION
# ============================================================

# Use the same Base64 signing secret and issuer as MS1.
app.jwt.secret=jYZ9QNhCFocpNYOVuKQAASIU+GcEHgysbWcEaIFlY4I=
app.jwt.issuer=msme-early-warning

# MS2's database user requires read access to this existing MS1 table.
msme.security.user-table=${MS1_USER_TABLE:USER4.APP_USER}




# ============================================================
# 7. SPRING BOOT ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true


# ============================================================
# 8. LOGGING CONFIGURATION
# ============================================================

logging.level.root=INFO
logging.level.com.msme.assessment=DEBUG
logging.level.org.springframework.security=INFO

# Do not log credentials or sensitive request bodies


# ============================================================
# 9. ERROR HANDLING
# ============================================================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

